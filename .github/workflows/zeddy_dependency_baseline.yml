name: Zeddy dependency baseline

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-baseline:
    name: Keep Cargo dependencies unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Verify dependency baseline
        run: ./script/check-zeddy-dependency-baseline
